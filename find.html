<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find My Car - Safar Wheels</title>
  <meta name="description" content="Answer four quick questions and we will suggest the three best cars for your trip.">
  <meta name="theme-color" content="#0b1f33">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="find">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div id="app">
      <section class="page-head">
        <div class="wrap">
          <p class="eyebrow">Find my car</p>
          <h1>Four questions. Three perfect cars.</h1>
          <p class="lead">Tell us about your trip and we will suggest the best fit.</p>
        </div>
      </section>

      <section class="wrap sec tight">
        <div class="card quiz" id="quiz">
          <div class="quiz-top">
            <div class="quiz-bar" aria-hidden="true"><i id="qbar"></i></div>
            <span class="quiz-count" id="qcount"></span>
          </div>
          <div id="qbody" aria-live="polite"></div>
          <div class="quiz-nav"><button type="button" class="btn btn-ghost btn-sm" id="qback" hidden>Back</button></div>
        </div>

        <div id="qresults" hidden>
          <div class="sec-head">
            <div><p class="eyebrow dark">Your top 3</p><h2>We suggest these cars</h2></div>
            <button type="button" class="btn btn-ghost" id="qagain">Start again</button>
          </div>
          <p class="muted" id="qsummary"></p>
          <div class="grid cars" id="qgrid"></div>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/art.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/find.js"></script>
</body>
</html>
